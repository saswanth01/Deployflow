# ════════════════════════════════════════════════════════════════════════════
# .github/workflows/ci-cd.yml
# DeployFlow — Automated CI/CD Pipeline
#
# Triggers: push to main, pull requests to main
# Pipeline: Checkout → Test → Docker Build → Deploy to Render
# Secrets required: RENDER_DEPLOY_HOOK (set in GitHub repo Settings > Secrets)
# ════════════════════════════════════════════════════════════════════════════

name: 🚀 DeployFlow CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: deployflow

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Lint & Test
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret-key-not-for-production

      - name: ✅ Verify Flask app starts
        run: |
          python -c "
          from app import app, init_db
          with app.app_context():
              init_db()
          with app.test_client() as c:
              r = c.get('/health')
              assert r.status_code == 200, f'Health check failed: {r.status_code}'
              import json
              data = json.loads(r.data)
              assert data['status'] == 'ok', f'Status not ok: {data}'
          print('✅ Flask app validation passed')
          "

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Docker Build & Test
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: 🐋 Docker Build & Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🐋 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --build-arg BUILD_NUMBER=${{ github.run_number }} \
            .

      - name: 🩺 Test Docker container health
        run: |
          # Start the container
          docker run -d \
            --name df-test \
            -p 5000:5000 \
            -e ENVIRONMENT=testing \
            -e SECRET_KEY=docker-ci-test-secret \
            -e BUILD_NUMBER=${{ github.run_number }} \
            ${{ env.IMAGE_NAME }}:latest

          # Wait for app to start (up to 30s)
          echo "⏳ Waiting for container to start..."
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Container health check passed on attempt $i"
              break
            fi
            echo "  Attempt $i/10 — waiting..."
            sleep 3
          done

          # Validate /health response
          HEALTH=$(curl -sf http://localhost:5000/health)
          echo "Health response: $HEALTH"
          echo "$HEALTH" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assert data['status'] == 'ok', f'Health status not ok: {data}'
          print('✅ /health endpoint validated')
          "

          # Validate home page returns 200
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Home page returned HTTP $HTTP_STATUS"
            docker logs df-test
            exit 1
          fi
          echo "✅ Home page returns HTTP 200"

          # Show container logs
          echo "📋 Container logs:"
          docker logs df-test

          # Stop and remove
          docker stop df-test
          docker rm df-test

      - name: 📊 Show Docker image size
        run: docker images ${{ env.IMAGE_NAME }}:latest

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Deploy to Render
  # Only runs on push to main (not on PRs)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🌐 Deploy to Render
    runs-on: ubuntu-latest
    needs: [ test, docker ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🚀 Trigger Render deployment
        run: |
          echo "🌐 Triggering Render deploy hook..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ]; then
            echo "✅ Render deployment triggered successfully (HTTP $RESPONSE)"
          else
            echo "⚠️  Render deploy hook returned HTTP $RESPONSE"
            echo "Please check your RENDER_DEPLOY_HOOK secret is set correctly."
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        # Don't fail the whole pipeline if secret is not configured yet
        continue-on-error: true

      - name: 📋 Deployment Summary
        run: |
          echo "════════════════════════════════════"
          echo "  🚀 DeployFlow CI/CD Pipeline"
          echo "════════════════════════════════════"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Build #:   ${{ github.run_number }}"
          echo "  Triggered: ${{ github.event_name }}"
          echo "  Actor:     ${{ github.actor }}"
          echo "════════════════════════════════════"
