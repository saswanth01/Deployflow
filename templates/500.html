{% extends "base.html" %}
{% block title %}500 — DeployFlow{% endblock %}
{% block page_title %}500 Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div style="font-size:6rem;color:#ef4444;opacity:.5">500</div>
  <h2 class="text-light mb-2">Internal Server Error</h2>
  <p class="text-muted mb-2">Something went wrong on the server.</p>
  {% if error %}<p class="text-danger small mb-4"><code>{{ error }}</code></p>{% endif %}
  <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house-fill me-2"></i>Back to Dashboard</a>
</div>
{% endblock %}
